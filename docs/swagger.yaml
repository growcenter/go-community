  /v2/events/{eventCode}/sessions:
    get:
      consumes:
      - application/json
      description: Fetch all event sessions associated with a specific event code
      parameters:
      - description: Event Code
        in: path
        name: eventCode
        required: true
        type: string
      - description: mandatory header to access endpoint
        in: header
        name: X-API-Key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully fetched event sessions
          schema:
            allOf:
            - $ref: '#/definitions/models.List'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.EventSession'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "422":
          description: Validation error.
          schema:
            allOf:
            - $ref: '#/definitions/models.ErrorResponse'
            - properties:
                errors:
                  $ref: '#/definitions/models.ErrorValidateResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Get All Sessions By Event Code
      tags:
      - events
  /v2/internal/events:
    post:
      consumes:
      - application/json
      description: |-
        Creates a new event along with its associated sessions and form questions.
        The event can be of various categories (e.g., registration, announcement, internal-attendance).
        It supports comprehensive configurations for images, organizers, access control, location (online/offline/hybrid), scheduling, recurrences, and notifications.

        **Important Notes:**
        - `sessions` are required unless the category is `announcement`.
        - `location` must match the event's location type (`online`, `offline`, or `hybrid`).
        - `access` controls who can view or register for the event.
      parameters:
      - description: Event creation payload containing core details, settings, sessions,
          and optional questions
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateEventRequest'
      - description: mandatory header to access endpoint
        in: header
        name: X-API-Key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created event with its sessions and form questions
          schema:
            $ref: '#/definitions/models.CreateEventResponse'
        "400":
          description: Bad Request - Invalid payload format or missing required fields
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized - Invalid or missing authentication token
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden - User does not have the required permissions
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "422":
          description: Unprocessable Entity - Validation errors (e.g., invalid location
            type, missing required linked fields)
          schema:
            allOf:
            - $ref: '#/definitions/models.ErrorResponse'
            - properties:
                errors:
                  $ref: '#/definitions/models.ErrorValidateResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new Event
      tags:
      - events
  /v2/internal/events/{eventCode}/sessions:
    post:
      consumes:
      - application/json
      description: |-
        Creates a new event session for a specific event. This can be a standalone session, or a child session (e.g., a breakout room or a specific track) if `parentSessionCode` is provided.

        **Inheritance & Defaults:**
        - If location details are omitted, the session inherits the location from the parent event (or parent session).
        - If status is omitted, it defaults to the event's status.
        - Timezone falls back to the event's timezone.

        **Registration & Capacity:**
        - `sessionCapacity.capacity`: Set to 0 for unlimited. Waitlist can only be enabled if capacity > 0 and registration method is not QR-based walk-in.
        - `sessionRules.registrationMode`: Supported modes are `self_only`, `self_and_registered`, and `self_and_others`.
        - `sessionRules.registrationMethods`: Options include `personal-qr`, `event-qr`, `session-qr`, `registration-qr`.
        - Supports age limits (`minAge`, `maxAge`) and prerequisites.

        **Check-in & Check-out:**
        - `checkIn` is enabled by default. You can configure `allowLate` and `lateThreshold` with specific late policies (`reject`, `warn`, `allow`).
        - Validations ensure that check-in/check-out times align with the session schedule.
      parameters:
      - description: Event Code
        in: path
        name: eventCode
        required: true
        type: string

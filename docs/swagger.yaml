  contact: {}
paths:
  /api/v2/campuses:
    get:
      consumes:
      - application/json
      description: Get Campuses from Config
      parameters:
      - description: mandatory header to access endpoint
        in: header
        name: X-API-Key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Response indicates that the request succeeded and the resources
            has been fetched and transmitted in the message body
          schema:
            allOf:
            - $ref: '#/definitions/models.List'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.CampusesResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "422":
          description: Validation error. This can happen if there is an error validation
            while create account
          schema:
            allOf:
            - $ref: '#/definitions/models.ErrorResponse'
            - properties:
                errors:
                  $ref: '#/definitions/models.ErrorValidateResponse'
              type: object
      summary: Get Campuses from Config
      tags:
      - config
  /api/v2/departments:
    get:
      consumes:
      - application/json
      description: Get Departments from Config
      parameters:
      - description: mandatory header to access endpoint
        in: header
        name: X-API-Key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Response indicates that the request succeeded and the resources
            has been fetched and transmitted in the message body
          schema:
            allOf:
            - $ref: '#/definitions/models.List'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.DepartmentsResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "422":
          description: Validation error. This can happen if there is an error validation
            while create account
          schema:
            allOf:
            - $ref: '#/definitions/models.ErrorResponse'
            - properties:
                errors:
                  $ref: '#/definitions/models.ErrorValidateResponse'
              type: object
      summary: Get Departments from Config
      tags:
      - config
  /api/v2/events/registers:
    post:
      consumes:
      - application/json
      description: This endpoint handles the registration of one or more attendees
        to a specific event instance. It supports different registration methods like
        QR code scanning or direct registration. The endpoint validates event status,
        instance availability, user permissions for private events, and registration
        quotas before creating the registration records.
      parameters:
      - description: The registration request payload, containing event/instance codes,
          registrant details, and a list of attendees with their information and form
          answers.
        in: body
        name: registrationRequest
        required: true
        schema:
          $ref: '#/definitions/models.CreateEventRegistrationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created the registration. The response includes
            the registration code and details of all attendees.
          schema:
            $ref: '#/definitions/models.CreateEventRegistrationResponse'
        "400":
          description: 'Bad Request. Possible causes: Mismatched event/instance codes,
            missing primary attendee, invalid registration method, or registration
            window is closed/not yet open.'
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden. The user does not have the required roles or permissions
            to register for this private event.
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found. The specified event, instance, or user does not
            exist.
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Conflict. The user has already registered for this event, or
            one of the attendees is already registered (if uniqueness is enforced).
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "422":
          description: Unprocessable Entity. The request body contains validation
            errors, such as invalid email/phone format or missing required fields.
          schema:
            allOf:
            - $ref: '#/definitions/models.ErrorResponse'
            - properties:
                errors:
                  $ref: '#/definitions/models.ErrorValidateResponse'
              type: object
        "429":
          description: Too Many Requests. The user has exceeded the registration quota
            for this event instance.
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error. An unexpected error occurred on the
            server.
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Register User to Event
      tags:
      - events
  /api/v2/internal/events:
    post:
      consumes:
      - application/json
      description: Create event with the instances/sessions
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Event creation request body
        in: body
        name: event
        required: true
        schema:
          $ref: '#/definitions/models.CreateEventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Response indicates that the request succeeded and the event
            has been created.
          schema:
            $ref: '#/definitions/models.CreateEventResponse'
        "400":
          description: Bad Request. Can be caused by invalid time ranges, or missing
            fields for private events.
